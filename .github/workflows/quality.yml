name: quality

on:
  pull_request:
  push:
    branches: [dev, stage, prod]

jobs:
  client-and-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run test:h015:evidence-integrity

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galactic_gunners
          POSTGRES_USER: galactic_gunners
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-local-placeholder
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "true"
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev]'
      - run: python manage.py check --settings=config.settings.local
      - run: python manage.py makemigrations --check --settings=config.settings.local
      - run: python manage.py migrate --noinput --settings=config.settings.local
      - run: pytest

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose up --build -d
      - run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8010/api/v1/health/; do sleep 5; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:3002/api/health; do sleep 5; done'
          curl -fsS http://localhost:3002/
      - if: always()
        run: docker compose down -v

  runtime-hostile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: docker compose config
      - run: docker compose up --build -d
      - run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8010/api/v1/health/; do sleep 5; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:3002/api/health; do sleep 5; done'
      - run: GG_RUNTIME_URL=http://localhost:3002 npm run runtime:hostile
      - if: always()
        run: docker compose down -v

  boarding-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run assets:sync
      - run: npm run contracts:boarding:validate

  boarding-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run assets:sync
      - run: npm run test:boarding
      - run: npm run runtime:boarding

  boarding-hostile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run assets:sync
      - run: npm run runtime:boarding:hostile

  score-validation-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: galactic_gunners, POSTGRES_USER: galactic_gunners, POSTGRES_PASSWORD: local-development-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners, DJANGO_SETTINGS_MODULE: config.settings.local, DJANGO_SECRET_KEY: ci-local-placeholder }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_game_runs_api.py

  leaderboard-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: galactic_gunners, POSTGRES_USER: galactic_gunners, POSTGRES_PASSWORD: local-development-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners, DJANGO_SETTINGS_MODULE: config.settings.local, DJANGO_SECRET_KEY: ci-local-placeholder }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_leaderboard_moderation.py::test_public_ranking_is_deterministic_and_one_best_run_per_player

  moderation-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: galactic_gunners, POSTGRES_USER: galactic_gunners, POSTGRES_PASSWORD: local-development-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners, DJANGO_SETTINGS_MODULE: config.settings.local, DJANGO_SECRET_KEY: ci-local-placeholder }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_leaderboard_moderation.py -k moderation

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run contracts:validate

  auth-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: galactic_gunners, POSTGRES_USER: galactic_gunners, POSTGRES_PASSWORD: local-development-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners, DJANGO_SETTINGS_MODULE: config.settings.local, DJANGO_SECRET_KEY: ci-local-placeholder }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_auth_surfaces.py

  tenant-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: galactic_gunners, POSTGRES_USER: galactic_gunners, POSTGRES_PASSWORD: local-development-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners, DJANGO_SETTINGS_MODULE: config.settings.local, DJANGO_SECRET_KEY: ci-local-placeholder }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e '.[dev]'
      - run: pytest organizations/tests/test_portal_api.py tests/test_plan_quota.py

  campaign-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: galactic_gunners, POSTGRES_USER: galactic_gunners, POSTGRES_PASSWORD: local-development-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners, DJANGO_SETTINGS_MODULE: config.settings.local, DJANGO_SECRET_KEY: ci-local-placeholder }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_campaign_service.py levels/tests/test_authoring.py levels/tests/test_levels_api.py

  runtime-browser:
    runs-on: ubuntu-latest
    env:
      GG_EVIDENCE_DIR: /tmp/h015-browser-evidence
      FOUNDER_REVIEW_MODE: 'true'
      FOUNDER_REVIEW_USERNAME: ci-founder-review
      FOUNDER_REVIEW_PASSWORD: ci-founder-review-password
      COMMAND_POST_REVIEW_USERNAME: ci-command-post-review
      COMMAND_POST_REVIEW_PASSWORD: ci-command-post-review-password
      PLAYER_REVIEW_USERNAME: ci-player-review
      PLAYER_REVIEW_PASSWORD: ci-player-review-password
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - name: Bind exact tested source revision
        id: source-sha
        run: |
          tested_sha="$(git rev-parse HEAD)"
          echo "value=$tested_sha" >> "$GITHUB_OUTPUT"
          echo "GG_TESTED_SHA=$tested_sha" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$tested_sha" >> "$GITHUB_ENV"
          echo "BUILD_ID=$tested_sha" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
      - run: docker compose up --build -d
      - run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:3002/api/health; do sleep 5; done'
          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T backend python manage.py seed_service_plans
          docker compose exec -T backend python manage.py seed_runtime_authority
          docker compose exec -T backend python manage.py bootstrap_founder_review
          printf 'Inceptivec administrator: %s / %s\nCommand Post customer: %s / %s\nPlayer: %s / %s\n' "$FOUNDER_REVIEW_USERNAME" "$FOUNDER_REVIEW_PASSWORD" "$COMMAND_POST_REVIEW_USERNAME" "$COMMAND_POST_REVIEW_PASSWORD" "$PLAYER_REVIEW_USERNAME" "$PLAYER_REVIEW_PASSWORD" > FOUNDER_REVIEW_ACCESS.local.txt
          mkdir -p "$GG_EVIDENCE_DIR"
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/hostile" npm run runtime:hostile
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/rectification/stage-1" npm run runtime:h015:stage1
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/rectification/stage-2" npm run runtime:h015:stage2
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/rectification/stage-3" npm run runtime:h015:stage3
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/rectification/stage-4" npm run runtime:h015:stage4
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/rectification/stage-9" npm run runtime:h015:stage9
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/campaign_runtime" npm run runtime:campaign
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/rectification/boarding" npm run runtime:h015:boarding
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/rectification/boarding_success" npm run runtime:h015:boarding-success
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/rectification/level4_hazards" npm run runtime:h015:level4-hazards
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/rectification/designer_roundtrip" npm run runtime:h015:designer-roundtrip
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/review_matrix" npm run runtime:h015:review-matrix
          npm run h015:build-evidence-manifest
          GG_EVIDENCE_MANIFEST="$GG_EVIDENCE_DIR/h015-evidence-manifest.json" npm run h015:closure-audit
      - name: Upload H015 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h015-browser-evidence-${{ steps.source-sha.outputs.value }}
          path: /tmp/h015-browser-evidence
          if-no-files-found: error
          retention-days: 30
      - if: always()
        run: docker compose down -v
