name: quality

on:
  pull_request:
  push:
    branches: [dev, stage, prod]

jobs:
  client-and-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run quality

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galactic_gunners
          POSTGRES_USER: galactic_gunners
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-local-placeholder
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "true"
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev]'
      - run: python manage.py check --settings=config.settings.local
      - run: python manage.py makemigrations --check --settings=config.settings.local
      - run: python manage.py migrate --noinput --settings=config.settings.local
      - run: pytest

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose up --build -d
      - run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8010/api/v1/health/; do sleep 5; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:3002/api/health; do sleep 5; done'
          curl -fsS http://localhost:3002/
      - if: always()
        run: docker compose down -v

  runtime-hostile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose config
      - run: docker compose up --build -d
      - run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8010/api/v1/health/; do sleep 5; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:3002/api/health; do sleep 5; done'
      - run: GG_RUNTIME_URL=http://localhost:3002 npm run runtime:hostile
      - if: always()
        run: docker compose down -v

  score-validation-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: galactic_gunners, POSTGRES_USER: galactic_gunners, POSTGRES_PASSWORD: local-development-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners, DJANGO_SETTINGS_MODULE: config.settings.local, DJANGO_SECRET_KEY: ci-local-placeholder }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_game_runs_api.py

  leaderboard-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: galactic_gunners, POSTGRES_USER: galactic_gunners, POSTGRES_PASSWORD: local-development-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners, DJANGO_SETTINGS_MODULE: config.settings.local, DJANGO_SECRET_KEY: ci-local-placeholder }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_leaderboard_moderation.py::test_public_ranking_is_deterministic_and_one_best_run_per_player

  moderation-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: galactic_gunners, POSTGRES_USER: galactic_gunners, POSTGRES_PASSWORD: local-development-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env: { DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners, DJANGO_SETTINGS_MODULE: config.settings.local, DJANGO_SECRET_KEY: ci-local-placeholder }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_leaderboard_moderation.py -k moderation
