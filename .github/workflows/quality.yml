name: quality

on:
  pull_request:
  push:
    branches: [dev, stage, prod]

jobs:
  client-and-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run test:h015:evidence-integrity

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: galactic_gunners
          POSTGRES_USER: galactic_gunners
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-local-placeholder
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "true"
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: python manage.py check --settings=config.settings.local
      - run: python manage.py makemigrations --check --settings=config.settings.local
      - run: python manage.py migrate --noinput --settings=config.settings.local
      - run: pytest

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
      - run: docker compose config
      - run: docker compose up --build -d
      - run: |
          timeout --signal=KILL 125s node scripts/wait-for-http.mjs --url http://localhost:8010/api/v1/health/
          timeout --signal=KILL 125s node scripts/wait-for-http.mjs --url http://localhost:3002/api/health
          curl -fsS http://localhost:3002/
      - run: GG_RUNTIME_URL=http://localhost:3002 npx playwright test tests/e2e/production-mode-negative.spec.ts --project=chromium-desktop --workers=1
      - if: always()
        run: docker compose down -v

  runtime-hostile:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GG_QA_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: docker compose config
      - run: docker compose up --build -d
      - run: |
          timeout --signal=KILL 125s node scripts/wait-for-http.mjs --url http://localhost:8010/api/v1/health/
          timeout --signal=KILL 125s node scripts/wait-for-http.mjs --url http://localhost:3002/api/v1/health/
          docker compose exec -T backend python manage.py migrate --noinput
          # Pool, movement and collision diagnostics need time to complete;
          # this isolated fixture does not alter player-facing game tuning.
          docker compose exec -T backend python manage.py seed_browser_assurance_campaign --duration-ms 300000
      - run: GG_RUNTIME_URL=http://localhost:3002 npm run runtime:hostile
      - if: always()
        run: docker compose down -v

  boarding-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run assets:sync
      - run: npm run contracts:boarding:validate

  boarding-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run assets:sync
      - run: npm run test:boarding
      - run: npm run runtime:boarding

  boarding-hostile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run assets:sync
      - run: npm run runtime:boarding:hostile

  score-validation-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: galactic_gunners,
            POSTGRES_USER: galactic_gunners,
            POSTGRES_PASSWORD: local-development-only,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      {
        DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners,
        DJANGO_SETTINGS_MODULE: config.settings.local,
        DJANGO_SECRET_KEY: ci-local-placeholder,
      }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_game_runs_api.py

  leaderboard-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: galactic_gunners,
            POSTGRES_USER: galactic_gunners,
            POSTGRES_PASSWORD: local-development-only,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      {
        DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners,
        DJANGO_SETTINGS_MODULE: config.settings.local,
        DJANGO_SECRET_KEY: ci-local-placeholder,
      }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_leaderboard_moderation.py::test_public_ranking_is_deterministic_and_one_best_run_per_player

  moderation-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: galactic_gunners,
            POSTGRES_USER: galactic_gunners,
            POSTGRES_PASSWORD: local-development-only,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      {
        DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners,
        DJANGO_SETTINGS_MODULE: config.settings.local,
        DJANGO_SECRET_KEY: ci-local-placeholder,
      }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_leaderboard_moderation.py -k moderation

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run contracts:validate

  auth-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: galactic_gunners,
            POSTGRES_USER: galactic_gunners,
            POSTGRES_PASSWORD: local-development-only,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      {
        DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners,
        DJANGO_SETTINGS_MODULE: config.settings.local,
        DJANGO_SECRET_KEY: ci-local-placeholder,
      }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_auth_surfaces.py

  tenant-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: galactic_gunners,
            POSTGRES_USER: galactic_gunners,
            POSTGRES_PASSWORD: local-development-only,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      {
        DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners,
        DJANGO_SETTINGS_MODULE: config.settings.local,
        DJANGO_SECRET_KEY: ci-local-placeholder,
      }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e '.[dev]'
      - run: pytest organizations/tests/test_portal_api.py tests/test_plan_quota.py

  campaign-hostile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: galactic_gunners,
            POSTGRES_USER: galactic_gunners,
            POSTGRES_PASSWORD: local-development-only,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U galactic_gunners -d galactic_gunners" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      {
        DATABASE_URL: postgresql://galactic_gunners:local-development-only@localhost:5432/galactic_gunners,
        DJANGO_SETTINGS_MODULE: config.settings.local,
        DJANGO_SECRET_KEY: ci-local-placeholder,
      }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e '.[dev]'
      - run: pytest tests/test_campaign_service.py levels/tests/test_authoring.py levels/tests/test_levels_api.py

  runtime-browser:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GG_QA_MODE: "true"
      GG_EVIDENCE_DIR: /tmp/h015-browser-evidence
      FOUNDER_REVIEW_MODE: "true"
      FOUNDER_REVIEW_USERNAME: ci-founder-review
      FOUNDER_REVIEW_PASSWORD: ci-founder-review-password
      COMMAND_POST_REVIEW_USERNAME: ci-command-post-review
      COMMAND_POST_REVIEW_PASSWORD: ci-command-post-review-password
      PLAYER_REVIEW_USERNAME: ci-player-review
      PLAYER_REVIEW_PASSWORD: ci-player-review-password
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - name: Bind exact tested source revision
        id: source-sha
        run: |
          tested_sha="$(git rev-parse HEAD)"
          echo "value=$tested_sha" >> "$GITHUB_OUTPUT"
          echo "GG_TESTED_SHA=$tested_sha" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$tested_sha" >> "$GITHUB_ENV"
          echo "BUILD_ID=$tested_sha" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
      - run: docker compose up --build -d
      - run: |
          web_ready=false
          for attempt in $(seq 1 12); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://localhost:3002/api/health; then web_ready=true; break; fi
            sleep 5
          done
          if [ "$web_ready" != true ]; then
            echo 'Timed out waiting for web health after 120 seconds' >&2
            exit 1
          fi
          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T backend python manage.py seed_service_plans
          docker compose exec -T backend python manage.py seed_runtime_authority
          # This remains diagnostic evidence, kept distinct from ordinary browser
          # journeys below. The closure auditor requires its exact-SHA record.
          docker compose exec -T backend python manage.py seed_browser_assurance_campaign --duration-ms 300000
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/hostile" npm run runtime:hostile
          # Ordinary input journeys need enough live simulation time to exercise
          # pause and controls. The short deterministic objective is reseeded
          # only for the campaign-progression browser suite below.
          docker compose exec -T backend python manage.py seed_browser_assurance_campaign --duration-ms 30000
          docker compose exec -T backend python manage.py bootstrap_founder_review
          mkdir -p "$GG_EVIDENCE_DIR/ordinary-browser"
          GG_RUNTIME_URL=http://localhost:3002 npx playwright test tests/e2e/public-entry.spec.ts tests/e2e/splash-menu.spec.ts tests/e2e/main-menu.spec.ts tests/e2e/pause-controls.spec.ts tests/e2e/auth-session.spec.ts tests/e2e/designer-pointer.spec.ts tests/e2e/tenant-isolation.spec.ts tests/accessibility/web-surfaces.spec.ts --project=chromium-desktop --workers=1
          cp test-results/playwright-junit.xml "$GG_EVIDENCE_DIR/ordinary-browser/chromium-desktop-junit.xml"
          docker compose exec -T backend python manage.py seed_browser_assurance_campaign --duration-ms 2500
          GG_RUNTIME_URL=http://localhost:3002 npx playwright test tests/e2e/campaign-real-play.spec.ts --project=chromium-desktop --workers=1
          cp test-results/playwright-junit.xml "$GG_EVIDENCE_DIR/ordinary-browser/campaign-progression-junit.xml"
          docker compose exec -T backend python manage.py seed_browser_assurance_campaign --duration-ms 2500 --scenario hazards
          GG_RUNTIME_URL=http://localhost:3002 npx playwright test tests/e2e/level4-hazards.spec.ts --project=chromium-desktop --workers=1
          cp test-results/playwright-junit.xml "$GG_EVIDENCE_DIR/ordinary-browser/level4-hazards-junit.xml"
          docker compose exec -T backend python manage.py seed_browser_assurance_campaign --duration-ms 450 --scenario boarding
          GG_RUNTIME_URL=http://localhost:3002 npx playwright test tests/e2e/boarding-ordinary.spec.ts --project=chromium-desktop --workers=1
          cp test-results/playwright-junit.xml "$GG_EVIDENCE_DIR/ordinary-browser/boarding-entry-abort-junit.xml"
           GG_RUNTIME_URL=http://localhost:3002 npx playwright test tests/e2e/main-menu.spec.ts tests/e2e/designer-pointer.spec.ts --project=chromium-mobile-touch --grep "__touch" --workers=1
           cp test-results/playwright-junit.xml "$GG_EVIDENCE_DIR/ordinary-browser/chromium-mobile-touch-junit.xml"
           printf 'Inceptivec administrator: %s / %s\nCommand Post customer: %s / %s\nPlayer: %s / %s\n' "$FOUNDER_REVIEW_USERNAME" "$FOUNDER_REVIEW_PASSWORD" "$COMMAND_POST_REVIEW_USERNAME" "$COMMAND_POST_REVIEW_PASSWORD" "$PLAYER_REVIEW_USERNAME" "$PLAYER_REVIEW_PASSWORD" > FOUNDER_REVIEW_ACCESS.local.txt
           mkdir -p "$GG_EVIDENCE_DIR"
           # QA diagnostics run in the dedicated runtime-hostile job. They are
           # deliberately excluded here: this artifact is ordinary-user and
           # exact-SHA closure evidence, not a diagnostic archive.
          GG_RUNTIME_URL=http://localhost:3002 GG_EVIDENCE_DIR="$GG_EVIDENCE_DIR/rectification/stage-9" npm run runtime:h015:stage9
          npm run h015:build-evidence-manifest
      - name: Upload immutable H015 browser evidence
        id: upload-evidence
        uses: actions/upload-artifact@v4
        with:
          name: h015-browser-evidence-${{ steps.source-sha.outputs.value }}
          path: /tmp/h015-browser-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Generate H015 closure attestation
        env:
          GG_EVIDENCE_MANIFEST: /tmp/h015-browser-evidence/h015-evidence-manifest.json
          GG_EVIDENCE_ARTIFACT_ID: ${{ steps.upload-evidence.outputs.artifact-id }}
          GG_EVIDENCE_ARTIFACT_NAME: h015-browser-evidence-${{ steps.source-sha.outputs.value }}
          GG_EVIDENCE_ARTIFACT_DIGEST: ${{ steps.upload-evidence.outputs.artifact-digest }}
          GG_CI_RUN_ID: ${{ github.run_id }}
          GG_CLOSURE_ATTESTATION_DIR: /tmp/h015-closure-attestation
        run: npm run h015:closure-attest
      - name: Upload H015 closure attestation
        id: upload-closure-attestation
        uses: actions/upload-artifact@v4
        with:
          name: h015-closure-attestation-${{ steps.source-sha.outputs.value }}
          path: /tmp/h015-closure-attestation
          if-no-files-found: error
          retention-days: 30
      - if: always()
        run: docker compose down -v
