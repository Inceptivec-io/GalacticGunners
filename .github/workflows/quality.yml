name: quality

on:
  pull_request:
  push:
    branches: [dev, stage, main]

jobs:
  client-and-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: npm run game:typecheck
      - run: npm --workspace apps/web run typecheck
      - run: npm run contracts:validate

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[dev]'
      - run: python manage.py check --settings=config.settings.local
      - run: pytest
