[project]
name = "galactic-gunners-backend"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "Django>=5.2,<6.0",
  "djangorestframework>=3.16,<4.0",
  "django-cors-headers>=4.7,<5.0",
  "drf-spectacular>=0.28,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "dj-database-url>=2.3,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-django>=4.10,<5.0",
  "ruff>=0.11,<1.0"
]

[tool.ruff]
line-length = 100
