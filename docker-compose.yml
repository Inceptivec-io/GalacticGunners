services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galactic_gunners}
      POSTGRES_USER: ${POSTGRES_USER:-galactic_gunners}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - galactic_gunners_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-galactic_gunners} -d ${POSTGRES_DB:-galactic_gunners}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://galactic_gunners:local-development-only@db:5432/galactic_gunners}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-placeholder-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3002}
      ENABLE_DJANGO_ADMIN: ${ENABLE_DJANGO_ADMIN:-false}
      FOUNDER_REVIEW_MODE: ${FOUNDER_REVIEW_MODE:-false}
      FOUNDER_REVIEW_USERNAME: ${FOUNDER_REVIEW_USERNAME:-}
      FOUNDER_REVIEW_PASSWORD: ${FOUNDER_REVIEW_PASSWORD:-}
      FOUNDER_REVIEW_DISPLAY_NAME: ${FOUNDER_REVIEW_DISPLAY_NAME:-Founder Review}
      SOURCE_SHA: ${SOURCE_SHA:-unknown}
      BUILD_ID: ${BUILD_ID:-local}
    ports:
      - "${BACKEND_HOST_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://backend:8000}
    ports:
      - "${WEB_HOST_PORT:-3002}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  galactic_gunners_postgres:
