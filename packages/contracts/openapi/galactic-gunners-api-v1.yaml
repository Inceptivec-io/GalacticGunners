openapi: 3.1.0
info:
  title: Galactic Gunners API
  version: 1.0.0
  description: Authoritative v1 interface for Galactic Gunners production architecture foundation.
servers:
  - url: /api/v1
paths:
  /health/:
    get:
      operationId: health
      summary: Service health.
      responses:
        '200':
          description: Backend healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /game-runs/:
    post:
      operationId: startGameRun
      summary: Start a pending game run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGameRunRequest'
      responses:
        '201':
          description: Game run created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /game-runs/{runId}/complete/:
    post:
      operationId: completeGameRun
      summary: Complete a pending game run under backend-owned validation.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreSubmission'
      responses:
        '200':
          description: Completion accepted and run validated by foundation policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletedGameRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /leaderboard/:
    get:
      operationId: listLeaderboard
      summary: List valid published leaderboard entries.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Valid published leaderboard entries ordered by score descending and published time ascending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /levels/:
    get:
      operationId: listPublishedLevels
      summary: List public published campaign levels.
      responses:
        '200':
          description: Published level catalogue.
  /levels/{slug}/:
    get:
      operationId: getPublishedLevel
      summary: Resolve the active published version for a level slug.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Published level authority. }
        '404': { $ref: '#/components/responses/NotFound' }
  /levels/{slug}/versions/{version}/:
    get:
      operationId: getPublishedLevelVersion
      summary: Resolve one published immutable level version.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Published immutable level version. }
  /admin/levels/:
    post:
      operationId: createLevelDraft
      summary: Create a privileged DRAFT level and version.
      responses:
        '201': { description: Draft created. }
        '403': { description: Level administrator required. }
  /admin/levels/import/:
    post:
      operationId: importLevelDraft
      summary: Import a validated DRAFT level only.
      responses:
        '201': { description: Draft imported. }
  /admin/levels/generate/:
    post:
      operationId: generateLevelDraft
      summary: Generate a deterministic DRAFT candidate; this endpoint never publishes.
      responses:
        '201': { description: Draft generated. }
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Incompatible lifecycle mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, api_version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: galactic-gunners-api
        api_version:
          type: string
          const: v1
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, detail, errors]
      properties:
        code:
          type: string
          enum: [invalid_request, not_found, conflict, request_failed]
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items: {}
              - type: object
    StartGameRunRequest:
      type: object
      additionalProperties: false
      required: [game_version, client_type]
      properties:
        game_version:
          type: string
          minLength: 1
          maxLength: 32
        client_type:
          $ref: '#/components/schemas/ClientType'
    GameRun:
      type: object
      additionalProperties: false
      required:
        - id
        - game_version
        - client_type
        - started_at
        - completed_at
        - score
        - level_reached
        - lives_used
        - nukes_used
        - victory
        - validity
      properties:
        id:
          type: string
          format: uuid
        game_version:
          type: string
          minLength: 1
          maxLength: 32
        client_type:
          $ref: '#/components/schemas/ClientType'
        started_at:
          type: string
          format: date-time
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        score:
          type: integer
          minimum: 0
        level_reached:
          type: string
          maxLength: 32
        lives_used:
          type: integer
          minimum: 0
        nukes_used:
          type: integer
          minimum: 0
        victory:
          type: boolean
        validity:
          $ref: '#/components/schemas/GameRunValidity'
    CompletedGameRun:
      type: object
      additionalProperties: false
      required: [id, score, level_reached, lives_used, nukes_used, victory, validity, completed_at]
      properties:
        id:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 0
        level_reached:
          type: string
          maxLength: 32
        lives_used:
          type: integer
          minimum: 0
        nukes_used:
          type: integer
          minimum: 0
        victory:
          type: boolean
        validity:
          $ref: '#/components/schemas/GameRunValidity'
        completed_at:
          type: string
          format: date-time
    ScoreSubmission:
      type: object
      additionalProperties: false
      required: [claimed_score, level_reached, lives_used, nukes_used, victory, event_summary]
      properties:
        claimed_score:
          type: integer
          minimum: 0
        level_reached:
          type: string
          maxLength: 32
        lives_used:
          type: integer
          minimum: 0
        nukes_used:
          type: integer
          minimum: 0
        victory:
          type: boolean
        event_summary:
          type: object
        payload_hash:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
        idempotency_key:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 128
            - type: 'null'
    LeaderboardEntry:
      type: object
      additionalProperties: false
      required: [run_id, display_name, score, published_at]
      properties:
        run_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        score:
          type: integer
          minimum: 0
        published_at:
          type: string
          format: date-time
    LeaderboardResponse:
      type: object
      additionalProperties: false
      required: [total, results]
      properties:
        total:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
    ClientType:
      type: string
      enum: [web, windows, macos, android, ios, unknown]
    GameRunValidity:
      type: string
      enum: [pending, valid, rejected]
