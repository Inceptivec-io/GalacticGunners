openapi: 3.1.0
info:
  title: Galactic Gunners API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health/:
    get:
      operationId: health
      responses:
        '200': { description: Backend healthy }
  /game-runs/:
    post:
      operationId: startGameRun
      responses:
        '201': { description: Game run created }
  /game-runs/{runId}/complete/:
    post:
      operationId: completeGameRun
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Completion accepted for validation }
  /leaderboard/:
    get:
      operationId: listLeaderboard
      responses:
        '200': { description: Ranked valid game runs }
